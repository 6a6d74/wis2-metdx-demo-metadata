# Non-secret configuration for the io-wis2dev-metdx-demo WIS2 Node.
# Any value can be overridden by an environment variable, e.g.
# WIS2_CENTRE_ID, WIS2_LOCAL_BROKER_URL, WIS2_TIMEOUTS_DELIVERY.
# The publisher password is never stored here: it comes from the
# LOCAL_BROKER_PUB_PASSWORD secret in the wis2-publish environment.

centre_id: io-wis2dev-metdx-demo

local_broker:
  url: mqtts://y8f22c8c.ala.eu-central-1.emqxsl.com:8883
  subscribe:
    username: everyone
    password: everyone
  publish:
    username: sgfit

global_broker:
  url: mqtts://gb.wis2dev.io:8883
  subscribe:
    username: everyone
    password: everyone

global_discovery_catalogue:
  # Labs GDC (OGC API - Records collection). After the ETS/KPI reports, each helper
  # polls <url>/items/<metadata-id> until the GDC holds this version of the record
  # (or, for a deletion, until it is gone). Empty disables the check.
  url: https://wmo-resource-catalogue.labs.wis2dev.io/collections/wis2-discovery-metadata
  poll_interval: 10

pages:
  # Empty means use the URL reported by the GitHub Pages deployment.
  base_url: ""

timeouts:  # seconds
  broker_connect: 15
  pages_live: 300
  delivery: 60
  monitor: 60
  gdc: 120
  # monitoring events timestamped more than this before our publish are ignored as stale
  clock_skew: 30

kpi:
  # Warn (never fail) when a GDC KPI percentage is below this value; null disables.
  warn_below_percentage: null

validation:
  # pywcmp fails centre-ids that are not in the official WIS2 list (ours is a test
  # centre). true reports those checks as warnings; our own rule still requires
  # ids to start with urn:wmo:md:<centre_id>:.
  relax_centre_id_checks: true

monitor:
  # GDC ETS tests (short ids, e.g. "identifier", "links") whose FAILED result is
  # reported as a warning instead of an error. Empty: every FAILED is an error.
  ets_failures_as_warnings: []

publish:
  # helper threads running at once
  max_workers: 4
