[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wis2node"
version = "0.1.0"
description = "No-code WIS2 Node: validate and publish WCMP2 discovery metadata"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "paho-mqtt>=2.0,<3",
    "pywcmp==0.14.5",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
